<div class="dialog-backdrop" role="presentation" (click)="cancelled.emit()">
  <section
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <h2 id="confirm-dialog-title">{{ title }}</h2>
    <p>{{ message }}</p>
    <div class="dialog-actions">
      <button type="button" class="cancel-button" (click)="cancelled.emit()">
        {{ cancelLabel }}
      </button>
      <button type="button" class="confirm-button" (click)="confirmed.emit()">
        {{ confirmLabel }}
      </button>
    </div>
  </section>
</div>
